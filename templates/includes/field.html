{% load i18n %}
{# Champ de formulaire : {{ form.field_name }} #}
<div class="field{% if field_class %} {{ field_class }}{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<p class="field__help">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="field__error">{{ error }}</p>{% endfor %}
</div>
